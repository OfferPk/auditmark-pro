  <text x="35" y="36" fill="#ffffff" font-family="Inter, sans-serif" font-weight="bold" font-size="18">🛡️</text>
  <text x="70" y="37" fill="#ffffff" font-family="Inter, sans-serif" font-weight="bold" font-size="20">AuditMark Pro</text>
  <rect x="235" y="19" width="125" height="22" rx="11" fill="rgba(16,185,129,0.15)"/>
  <text x="246" y="34" fill="#34d399" font-family="Inter, sans-serif" font-weight="600" font-size="11">COMPLIANCE SUITE</text>

  <rect x="1030" y="14" width="145" height="32" rx="6" fill="#10b981"/>
  <text x="1045" y="34" fill="#022c22" font-family="Inter, sans-serif" font-weight="bold" font-size="12">🚀 Get Banner Embed</text>

  <!-- Left Sidebar -->
  <rect x="0" y="60" width="460" height="640" fill="#0f172a" stroke="rgba(255,255,255,0.08)"/>
  <text x="25" y="95" fill="#94a3b8" font-family="Inter, sans-serif" font-weight="bold" font-size="12">ORGANIZATION &amp; STATUTORY PARAMETERS</text>
  
  <rect x="25" y="115" width="410" height="36" rx="6" fill="#070d17" stroke="rgba(255,255,255,0.1)"/>
  <text x="35" y="138" fill="#ffffff" font-family="Inter, sans-serif" font-size="13">Nova Brands Direct LLC</text>

  <rect x="25" y="165" width="200" height="36" rx="6" fill="#070d17" stroke="rgba(255,255,255,0.1)"/>
  <text x="35" y="188" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">https://novabrandsdirect.com</text>

  <rect x="235" y="165" width="200" height="36" rx="6" fill="#070d17" stroke="rgba(255,255,255,0.1)"/>
  <text x="245" y="188" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">GDPR (UK/EU) + CCPA</text>

