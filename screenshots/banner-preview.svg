  <rect x="500" y="80" width="660" height="580" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="530" y="125" fill="#0f172a" font-family="Inter, sans-serif" font-size="20" font-weight="800">Privacy Policy &amp; Data Protection Statement</text>
  <text x="530" y="150" fill="#64748b" font-family="Inter, sans-serif" font-size="12">Organization: Nova Brands Direct LLC | Framework: GDPR &amp; CCPA/CPRA</text>
  <line x1="530" y1="165" x2="1130" y2="165" stroke="#e2e8f0"/>

  <text x="530" y="195" fill="#0f172a" font-family="Inter, sans-serif" font-size="13" font-weight="bold">1. Regulatory Framework &amp; Scope</text>
  <text x="530" y="215" fill="#334155" font-family="Inter, sans-serif" font-size="11">Data collected via novabrandsdirect.com strictly adheres to European GDPR, UK Data Protection Act, and CCPA.</text>

  <text x="530" y="255" fill="#0f172a" font-family="Inter, sans-serif" font-size="13" font-weight="bold">2. Sub-Processors &amp; Telemetry Endpoints</text>
  <text x="530" y="275" fill="#334155" font-family="Inter, sans-serif" font-size="11">• Shopify Payments, Stripe, Klaviyo Email Marketing, Google Analytics 4, Meta Pixel</text>

  <!-- Embedded Simulated Banner at bottom of stage -->
  <rect x="520" y="470" width="620" height="150" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.15)"/>
  <text x="545" y="505" fill="#f8fafc" font-family="Inter, sans-serif" font-size="14" font-weight="bold">🛡️ We Value Your Privacy &amp; Data Rights</text>
  <text x="545" y="530" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">We use cookies to personalize product recommendations and analyze traffic under GDPR &amp; CCPA.</text>
  <rect x="545" y="560" width="110" height="32" rx="6" fill="#10b981"/>
  <text x="565" y="581" fill="#022c22" font-family="Inter, sans-serif" font-weight="bold" font-size="12">Accept All</text>
  <rect x="665" y="560" width="130" height="32" rx="6" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
  <text x="680" y="581" fill="#ffffff" font-family="Inter, sans-serif" font-size="12">Necessary Only</text>
